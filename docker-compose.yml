version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aicte_complaints
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/aicte_complaints
      - OPENAI_API_KEY=placeholder_api_key_aicte_oss_120b
      - OPENAI_BASE_URL=https://api.custom-ai-gateway.aicte.gov.in/v1
      - AI_MODEL_NAME=gpt-oss-120b
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aicte_dashboard_ui
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
